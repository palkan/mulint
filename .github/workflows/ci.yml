name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.1
          args: --timeout 3m

  action-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Action passes on a clean package
        uses: ./
        with:
          args: ./mulint/...
      - name: Action fails on fixtures with violations
        id: negative
        uses: ./
        continue-on-error: true
        with:
          args: ./tests/
          annotations: 'false'
      - name: Assert violations were detected
        run: test "${{ steps.negative.outcome }}" = "failure"

  test:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest]
        go-version: ["1.24", "1.25"]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build
        run: go build ./...
      - name: Run tests
        run: go test ./...
